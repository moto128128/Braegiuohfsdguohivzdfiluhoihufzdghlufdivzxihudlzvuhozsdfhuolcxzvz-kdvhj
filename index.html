<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controller</title>
  <style>
    body { font-family: sans-serif; background: #121824; color: #fff; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
    .panel { background: #1e2640; border: 1px solid #334155; border-radius: 8px; padding: 15px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    button { padding: 10px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; }
    
    /* Pepsi Nozzles Colors */
    [data-f="water"] { background: #3a7bd5; } [data-f="pepsi"] { background: #004b93; border-bottom: 3px solid #e32b22; color: #fff; }
    [data-f="diet"] { background: #64748b; } [data-f="dew"] { background: #106b21; color: #cf0; }
    [data-f="mug"] { background: #5c3a21; color: #f9a8d4; } [data-f="drp"] { background: #701a24; color: #fff; }
    [data-f="starry"] { background: #0d5c3a; color: #facc15; } [data-f="crush"] { background: #ea580c; } [data-f="gat"] { background: #0284c7; }
    .selected { outline: 2px solid #fff; }

    /* Pour Area & Cup */
    .stage { background: #0f172a; height: 120px; position: relative; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; margin: 10px 0; border-radius: 6px; }
    .stream { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 6px; height: 0; transition: height 0.1s; }
    .stream.active { height: 75px; }
    .cup-box { width: 50px; height: 70px; border: 2px solid #aaa; border-top: none; border-radius: 0 0 8px 8px; overflow: hidden; transition: transform 0.5s ease-in; position: relative; margin-bottom: 5px; }
    .liquid { position: absolute; bottom: 0; width: 100%; height: 0; transition: height 0.1s linear; }
    .slide { transform: translateX(300px); }
    #pour { background: #ef4444; color: #fff; width: 80px; height: 80px; border-radius: 50%; margin: auto; display: block; }

    /* Pretend food cooker */
    .food-form { display: flex; gap: 8px; margin: 12px 0; }
    .food-form input { min-width: 0; flex: 1; padding: 10px; border: 1px solid #475569; border-radius: 6px; background: #0f172a; color: #fff; }
    #foodMenu button { background: #334155; color: #fff; }
    #foodMenu button.selected { background: #166534; }
    #foodManager { margin: 10px 0; }
    .food-edit-list { display: grid; gap: 6px; margin: 10px 0; }
    .food-edit-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 8px; background: #0f172a; padding: 8px; border-radius: 6px; }
    .food-edit-row input { min-width: 0; padding: 8px; border: 1px solid #475569; border-radius: 6px; background: #1e2640; color: #fff; }
    .food-edit-row .delete-food { background: #991b1b; color: #fff; }
    #foodForm[hidden], #foodMenu[hidden], #foodEditor[hidden] { display: none; }
    .cooker-stage { height: 150px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; margin: 12px 0; border-radius: 6px; background: #0f172a; }
    .burner { width: 132px; height: 132px; border: 8px solid #475569; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: border-color .5s, box-shadow .5s; }
    .burner.on { border-color: #f97316; box-shadow: 0 0 24px #ef444488; }
    .pan { width: 94px; height: 94px; border-radius: 50%; background: #64748b; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 5px #334155; }
    .food-piece { width: 48px; height: 48px; border-radius: 50%; background: #eab308; transition: filter .8s, transform .8s; }
    .cook-progress { height: 8px; border-radius: 4px; background: #334155; overflow: hidden; margin: 10px 0; }
    .cook-progress > div { height: 100%; width: 0; background: #f97316; transition: width .1s linear; }
    .cook-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    #cookStart { background: #059669; color: #fff; }
    #cookStop { background: #dc2626; color: #fff; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #cookStatus { min-height: 1.3em; margin: 8px 0 0; text-align: center; }

    /* Stove & Tables */
    .dot { width: 12px; height: 12px; border-radius: 50%; background: #64748b; display: inline-block; }
    .dot.on { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
    .t-card { background: #2a3558; padding: 10px; text-align: center; border-radius: 6px; cursor: pointer; }
    [data-s="READY"] { color: #34d399; } [data-s="OCCUPIED"] { color: #f87171; } [data-s="DIRTY"] { color: #fbbf24; }
  </style>
</head>
<body>

  <!-- Beverage Station -->
  <div class="panel">
    <div class="grid-3" id="flavors">
      <button class="selected" data-f="water" data-c="#cbd5e1">WATER</button>
      <button data-f="pepsi" data-c="#004b93">PEPSI</button>
      <button data-f="diet" data-c="#94a3b8">DIET PEPSI</button>
      <button data-f="dew" data-c="#a3e635">MTN DEW</button>
      <button data-f="mug" data-c="#78350f">MUG</button>
      <button data-f="drp" data-c="#4c0519">DR PEPPER</button>
      <button data-f="starry" data-c="#eab308">STARRY</button>
      <button data-f="crush" data-c="#f97316">CRUSH</button>
      <button data-f="gat" data-c="#38bdf8">GATORADE</button>
    </div>
    <div class="stage">
      <div class="stream" id="str"></div>
      <div class="cup-box" id="cup"><div class="liquid" id="liq"></div></div>
    </div>
    <button id="pour">HOLD</button>
  </div>

  <!-- Food Cooker -->
  <div class="panel">
    <h2>Pretend Food Cooker</h2>
    <button id="foodManager" type="button">EDIT FOODS</button>
    <div class="grid-3" id="foodMenu" aria-label="Choose a food"></div>
    <div id="foodEditor" class="food-edit-list" aria-label="Edit foods" hidden></div>
    <form class="food-form" id="foodForm" hidden>
      <input id="foodInput" type="text" maxlength="24" placeholder="Add a food..." aria-label="New food name" required>
      <button type="submit">ADD FOOD</button>
    </form>
    <div class="cooker-stage" aria-label="Food cooking on a pan">
      <div class="burner" id="cookBurner"><div class="pan"><div class="food-piece" id="foodPiece"></div></div></div>
    </div>
    <div class="cook-progress" aria-hidden="true"><div id="cookProgress"></div></div>
    <div class="cook-actions">
      <button id="cookStart" type="button" disabled>START</button>
      <button id="cookStop" type="button" disabled>STOP</button>
    </div>
    <p id="cookStatus" role="status" aria-live="polite">Add a food to get started.</p>
  </div>

  <!-- Stove System -->
  <div class="panel grid-2">
    <div>Stove Elements: <span class="dot" id="sLight"></span></div>
    <div class="grid-2">
      <button style="background:#059669;color:#fff" onclick="document.getElementById('sLight').classList.add('on')">ON</button>
      <button style="background:#dc2626;color:#fff" onclick="document.getElementById('sLight').classList.remove('on')">OFF</button>
    </div>
  </div>

  <!-- Six Tables Seating Layout -->
  <div class="panel grid-3">
    <div class="t-card" onclick="toggleT(this)">T1 <div data-s="READY">READY</div></div>
    <div class="t-card" onclick="toggleT(this)">T2 <div data-s="OCCUPIED">OCCUPIED</div></div>
    <div class="t-card" onclick="toggleT(this)">T3 <div data-s="READY">READY</div></div>
    <div class="t-card" onclick="toggleT(this)">T4 <div data-s="DIRTY">DIRTY</div></div>
    <div class="t-card" onclick="toggleT(this)">T5 <div data-s="READY">READY</div></div>
    <div class="t-card" onclick="toggleT(this)">T6 <div data-s="READY">READY</div></div>
  </div>

  <script>
    let color = '#cbd5e1', h = 0, timer;
    const cup = document.getElementById('cup'), liq = document.getElementById('liq'), str = document.getElementById('str'), btn = document.getElementById('pour');

    // Menu Flavor Selection Logic
    document.querySelectorAll('#flavors button').forEach(b => b.onclick = () => {
      document.querySelector('#flavors .selected').classList.remove('selected'); b.classList.add('selected');
      color = b.getAttribute('data-c');
    });

    // Unified Input Pour Event Bindings (Mouse + Mobile Touchscreen compatible)
    ['mousedown', 'touchstart'].forEach(e => btn.addEventListener(e, (evt) => {
      evt.preventDefault(); if(cup.classList.contains('slide')) return;
      str.style.background = liq.style.background = color; str.classList.add('active');
      timer = setInterval(() => { if(h < 85) { h += 3; liq.style.height = h + '%'; } }, 30);
    }));

    ['mouseup', 'mouseleave', 'touchend'].forEach(e => btn.addEventListener(e, () => {
      clearInterval(timer); str.classList.remove('active');
      if (h > 5) {
        setTimeout(() => { cup.classList.add('slide'); 
          setTimeout(() => { cup.style.opacity = '0'; cup.classList.remove('slide'); h = 0; liq.style.height = '0%'; 
            setTimeout(() => { cup.style.opacity = '1'; }, 100);
          }, 500);
        }, 150);
      }
    }));

    // Table Cycle Rotator Engine
    function toggleT(el) {
      const div = el.querySelector('div'), states = ['READY', 'OCCUPIED', 'DIRTY'];
      let next = states[(states.indexOf(div.getAttribute('data-s')) + 1) % 3];
      div.setAttribute('data-s', next); div.textContent = next;
    }

    // Food selection and cooking timer
    const foodMenu = document.getElementById('foodMenu');
    const foodEditor = document.getElementById('foodEditor');
    const foodForm = document.getElementById('foodForm');
    const foodInput = document.getElementById('foodInput');
    const foodManager = document.getElementById('foodManager');
    const cookStart = document.getElementById('cookStart');
    const cookStop = document.getElementById('cookStop');
    const cookBurner = document.getElementById('cookBurner');
    const foodPiece = document.getElementById('foodPiece');
    const cookProgress = document.getElementById('cookProgress');
    const cookStatus = document.getElementById('cookStatus');
    const foodColors = ['#eab308', '#fb923c', '#f87171', '#a3e635', '#c084fc', '#f9a8d4'];
    const foods = [];
    let cookTimer, cookStartedAt, selectedFood, editingFoods = false;

    function addFood(name) {
      const food = name.trim();
      if (!food) return;
      foods.push({ name: food, color: foodColors[foods.length % foodColors.length] });
      renderFoods();
    }

    function renderFoods() {
      foodMenu.replaceChildren();
      foodEditor.replaceChildren();
      foods.forEach(food => {
        const option = document.createElement('button');
        option.type = 'button';
        option.textContent = food.name;
        option.classList.toggle('selected', selectedFood === food);
        option.onclick = () => {
          if (cookTimer || editingFoods) return;
          selectedFood = food;
          foodPiece.style.backgroundColor = food.color;
          foodPiece.style.filter = 'none';
          cookStart.disabled = false;
          cookStatus.textContent = food.name + ' is ready to cook.';
          renderFoods();
        };
        foodMenu.appendChild(option);

        const row = document.createElement('div');
        row.className = 'food-edit-row';
        const name = document.createElement('span');
        name.textContent = food.name;
        const edit = document.createElement('button');
        edit.type = 'button';
        edit.textContent = 'EDIT';
        edit.onclick = () => {
          const input = document.createElement('input');
          input.value = food.name;
          input.maxLength = 24;
          input.setAttribute('aria-label', 'Food name');
          const save = document.createElement('button');
          save.type = 'button';
          save.textContent = 'SAVE';
          save.onclick = () => {
            const updatedName = input.value.trim();
            if (!updatedName) {
              input.focus();
              return;
            }
            food.name = updatedName;
            renderFoods();
          };
          row.replaceChildren(input, save, remove);
          input.focus();
        };
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'delete-food';
        remove.textContent = 'DELETE';
        remove.onclick = () => {
          foods.splice(foods.indexOf(food), 1);
          if (selectedFood === food) {
            selectedFood = null;
            cookStart.disabled = true;
            foodPiece.style.filter = 'none';
            cookStatus.textContent = 'Choose a food to get started.';
          }
          renderFoods();
        };
        row.append(name, edit, remove);
        foodEditor.appendChild(row);
      });
    }

    ['BURGER', 'PIZZA', 'EGG', 'TOAST'].forEach(addFood);
    foodManager.addEventListener('click', () => {
      editingFoods = !editingFoods;
      foodMenu.hidden = editingFoods;
      foodEditor.hidden = !editingFoods;
      foodForm.hidden = !editingFoods;
      foodManager.textContent = editingFoods ? 'DONE' : 'EDIT FOODS';
      cookStart.disabled = editingFoods || !selectedFood;
    });
    foodForm.addEventListener('submit', event => {
      event.preventDefault();
      addFood(foodInput.value);
      foodInput.value = '';
      foodInput.focus();
    });

    function updateCooking() {
      const seconds = (performance.now() - cookStartedAt) / 1000;
      const progress = Math.min(seconds / 30, 1);
      cookProgress.style.width = (progress * 100) + '%';
      foodPiece.style.filter = seconds < 20
        ? `saturate(${0.8 + seconds / 50}) brightness(${0.85 + seconds / 120})`
        : `saturate(1.2) brightness(${Math.max(0.48, 1 - (seconds - 20) / 45)}) sepia(${Math.min((seconds - 20) / 35, 0.65)})`;
      cookStatus.textContent = `${selectedFood} cooking... ${seconds.toFixed(1)} seconds (perfect at 20–30)`;
    }

    cookStart.addEventListener('click', () => {
      if (!selectedFood || cookTimer) return;
      cookStartedAt = performance.now();
      cookTimer = setInterval(updateCooking, 100);
      cookBurner.classList.add('on');
      cookStart.disabled = true;
      cookStop.disabled = false;
      foodManager.disabled = true;
      updateCooking();
    });

    cookStop.addEventListener('click', () => {
      if (!cookTimer) return;
      const seconds = (performance.now() - cookStartedAt) / 1000;
      clearInterval(cookTimer);
      cookTimer = null;
      cookBurner.classList.remove('on');
      cookStart.disabled = false;
      cookStop.disabled = true;
      foodManager.disabled = false;
      cookStatus.textContent = seconds < 20
        ? `${selectedFood} stopped at ${seconds.toFixed(1)} seconds: a little undercooked!`
        : seconds <= 30
          ? `${selectedFood} stopped at ${seconds.toFixed(1)} seconds: perfect temperature!`
          : `${selectedFood} stopped at ${seconds.toFixed(1)} seconds: a little overcooked!`;
    });
  </script>
</body>
</html>
